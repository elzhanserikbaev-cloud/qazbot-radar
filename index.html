<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QazBot Robotics Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky control bar over a responsive card grid; detail opens in a side sheet. Palette continues the QazBot deck (navy + teal). */
:root {
  --bg: #F3F6FA; --surface: #FFFFFF; --ink: #14233A; --muted: #5E6B7E; --line: #DCE3EC;
  --accent: #1F8A70; --accent-soft: #E3F3EE; --navy: #142B4C;
  --ok: #1F8A70; --warn: #B7700C; --warn-soft: #FBF0DF;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1522; --surface: #152033; --ink: #E6ECF4; --muted: #93A1B5; --line: #24324A;
  --accent: #3CC09B; --accent-soft: #143A33; --navy: #0A1220; --ok: #3CC09B; --warn: #E2A54A; --warn-soft: #3A2C14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1522; --surface: #152033; --ink: #E6ECF4; --muted: #93A1B5; --line: #24324A;
  --accent: #3CC09B; --accent-soft: #143A33; --navy: #0A1220; --ok: #3CC09B; --warn: #E2A54A; --warn-soft: #3A2C14; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: var(--accent); }
header.top { background: var(--navy); color: #fff; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top .wrap { padding-block: 28px 22px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; }
h1 { font: 700 clamp(26px, 4vw, 38px)/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: #B9C7DA; margin-top: 6px; }
.stats { display: flex; gap: 22px; font-variant-numeric: tabular-nums; }
.stats b { display: block; font: 700 24px/1 var(--display); color: #fff; }
.stats span { font-size: 12px; color: #B9C7DA; letter-spacing: .04em; text-transform: uppercase; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs button, .chip { font: 500 14px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tabs button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { color: inherit; opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#sort { font: 500 14px var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
#q { flex: 1 1 240px; min-width: 0; font: 15px var(--body); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
label.only { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
main .wrap { padding-block: 22px 60px; }
.week { font: 700 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; }
.week:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 16px; }
.grid > *, .feed > *, header.top .wrap > * { min-width: 0; }
.feed { display: flex; flex-direction: column; gap: 12px; max-width: 980px; }
.feed .card { flex-direction: row; }
.feed .thumb { flex: 0 0 300px; aspect-ratio: 16 / 9; align-self: stretch; height: auto; }
.feed .card p { -webkit-line-clamp: 2; }
@media (max-width: 680px) { .feed .card { flex-direction: column; } .feed .thumb { flex: none; width: 100%; } }
html, body { overflow-x: hidden; }
.card { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; }
.card:hover { border-color: var(--accent); }
.thumb { aspect-ratio: 16 / 9; background: var(--line); display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { font: 700 13px var(--display); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.cbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 2px 8px; font-weight: 600; }
.badge { font-weight: 600; }
.badge.official { color: var(--ok); }
.badge.media { color: var(--warn); }
.card h3 { font: 700 18px/1.25 var(--display); margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.gif { position: absolute; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; }
.tbl h4 { font: 700 16px var(--display); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
/* detail sheet */
dialog { border: 0; padding: 0; width: min(760px, 100%); max-height: 100%; height: 100%; margin: 0 0 0 auto; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(8, 14, 24, .55); }
.sheet { padding: 22px max(22px, env(safe-area-inset-right, 0px)) 40px 22px; display: flex; flex-direction: column; gap: 16px; }
.sheet .close { align-self: flex-end; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: 500 14px var(--body); }
.sheet h2 { font: 700 28px/1.15 var(--display); margin: 0; text-wrap: balance; }
.sheet .hero { width: 100%; border-radius: 8px; background: var(--line); }
.cap { font-size: 12.5px; color: var(--muted); margin-top: -10px; }
.about { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; }
.about b { color: var(--accent); }
.sheet ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.specs div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.specs span { display: block; color: var(--muted); font-size: 12px; }
.take { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-weight: 600; }
.sheet h5 { font: 700 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; }
.ev { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.ev q { display: block; color: var(--muted); font-style: italic; }
@media (max-width: 560px) { .stats { gap: 16px; } .stats b { font-size: 20px; } dialog { width: 100%; } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
/* password lock */
body.locked header.top, body.locked .bar, body.locked main { display: none; }
.lock { min-height: 100vh; display: grid; place-items: center; background: var(--navy); padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lockcard { width: min(400px, 100%); background: var(--surface); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.lockcard h1 { font-size: 26px; color: var(--ink); }
.lockcard p { margin: 0; color: var(--muted); }
.lockcard input[type=password] { font: 16px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.lockcard button { font: 600 15px var(--body); padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
.lockcard button:disabled { opacity: .7; cursor: progress; }
.err { color: #C0392B; font-size: 14px; min-height: 1em; }
.logout { font: 500 13px var(--body); background: transparent; color: #B9C7DA; border: 1px solid #3A5170; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>QazBot Robotics Radar</h1><div class="sub" id="sub"></div></div>
  <div class="stats" id="stats"></div>
</div></header>
<div class="bar"><div class="wrap">
  <div class="row tabs" role="group" aria-label="Раздел">
    <button id="tab-news" aria-pressed="true">Новости</button>
    <button id="tab-catalog" aria-pressed="false">Каталог</button>
  </div>
  <div class="row" id="chips" role="group" aria-label="Категория"></div>
  <div class="row">
    <input id="q" type="search" placeholder="Поиск: Unitree, кисть, VLA…" aria-label="Поиск">
    <select id="sort" aria-label="Сортировка">
      <option value="new">Сначала новые</option>
      <option value="old">Сначала старые</option>
      <option value="name">По роботу (А–Я)</option>
    </select>
    <label class="only"><input id="only" type="checkbox"> только подтверждённые первоисточником</label>
  </div>
</div></div>
<main><div class="wrap" id="out"></div></main>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

        .then(function (base) { return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(RAW.salt), iterations: RAW.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']); })
        .then(function (key) { return openWith(key).then(function (D) {
          if (document.getElementById('rem').checked) crypto.subtle.exportKey('raw', key).then(function (r) { try { localStorage.setItem(REMEMBER, ub64(new Uint8Array(r))); } catch (x) {} });
          box.remove(); document.body.classList.remove('locked'); app(D, key);
        }); })
        .catch(function () { go.disabled = false; go.textContent = 'Войти'; err.textContent = 'Неверный пароль. Попробуйте ещё раз.'; pw.select(); });
    });
  }
  if (RAW.enc) {
    var saved = null; try { saved = localStorage.getItem(REMEMBER); } catch (x) {}
    if (saved) {
      crypto.subtle.importKey('raw', b64(saved), {name: 'AES-GCM'}, false, ['decrypt'])
        .then(function (key) { return openWith(key).then(function (D) { app(D, key); }); })
        .catch(function () { try { localStorage.removeItem(REMEMBER); } catch (x) {} lockScreen(); });
    } else lockScreen();
  } else app(RAW, null);

  function app(D, KEY) {
  var names = {}; D.groups.forEach(function (g) { names[g[0]] = g[1]; });
  var state = {tab: 'news', group: 'all', q: '', only: false, sort: 'new'};
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }
  function link(s) { var u = safeUrl(s.url); if (!u) return el('span', '', s.label || ''); var a = el('a', '', s.label || u); a.href = u; a.target = '_blank'; a.rel = 'noopener'; return a; }
  var STATUS = {official: '✓ первоисточник', media: 'профильные СМИ'};
  var blobs = {};
  function blobUrl(path, mime) {  // encrypted media -> decrypted blob: URL (cached)
    if (!blobs[path]) blobs[path] = fetch(path).then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) { return decrypt(KEY, new Uint8Array(buf)); })
      .then(function (plain) { return URL.createObjectURL(new Blob([plain], {type: mime})); });
    return blobs[path];
  }
  function media(i, cls) {
    var isVideo = /\.mp4$/i.test(i.media) || /^video\//.test(i.mime || '');
    var e = el(isVideo ? 'video' : 'img', cls);
    if (isVideo) { e.muted = true; e.autoplay = true; e.loop = true; e.playsInline = true; e.setAttribute('muted', ''); e.setAttribute('playsinline', ''); e.setAttribute('aria-label', i.title); }
    else { e.alt = i.title; e.loading = 'lazy'; }
    if (KEY && i.mime) blobUrl(i.media, i.mime).then(function (u) { e.src = u; }).catch(function () {});
    else e.src = i.media;
    return e;
  }
  if (KEY) {
    var out = el('button', 'logout', 'Выйти'); out.type = 'button';
    out.onclick = function () { try { localStorage.removeItem(REMEMBER); } catch (x) {} location.reload(); };
    document.querySelector('header.top .wrap').appendChild(out);
  }

  $('sub').textContent = 'Инженерные разработки в робототехнике · обновлено ' + D.updated;
  [['Новостей', D.news.length], ['Моделей в каталоге', D.catalog.length], ['Дней с новостями', new Set(D.news.map(function (i) { return i.sort; })).size]]
    .forEach(function (s) { var d = el('div'); d.appendChild(el('b', '', String(s[1]))); d.appendChild(el('span', '', s[0])); $('stats').appendChild(d); });

  function list() { return state.tab === 'news' ? D.news : D.catalog; }
  function matches(i) {
    if (state.group !== 'all' && i.group !== state.group) return false;
    if (state.only && i.status !== 'official') return false;
    if (!state.q) return true;
    var hay = [i.title, i.category, i.about, i.takeaway].concat(i.bullets || []).join(' ').toLowerCase();
    return state.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function chips() {
    var box = $('chips'); box.textContent = '';
    var src = list(), counts = {};
    src.forEach(function (i) { counts[i.group] = (counts[i.group] || 0) + 1; });
    [['all', 'Все']].concat(D.groups).forEach(function (g) {
      if (g[0] !== 'all' && !counts[g[0]]) return;
      var b = el('button', 'chip', g[1]); b.setAttribute('aria-pressed', String(state.group === g[0]));
      b.appendChild(el('small', '', String(g[0] === 'all' ? src.length : counts[g[0]])));
      b.onclick = function () { state.group = g[0]; render(); };
      box.appendChild(b);
    });
  }
  function card(i) {
    var c = el('button', 'card'); c.type = 'button';
    var t = el('div', 'thumb');
    if (i.media) t.appendChild(media(i));
    else t.appendChild(el('span', 'ph', names[i.group] || ''));
    c.appendChild(t);
    var b = el('div', 'cbody'), m = el('div', 'meta');
    m.appendChild(el('span', 'tag', i.category || names[i.group] || ''));
    if (i.date) m.appendChild(el('span', '', i.date));
    if (STATUS[i.status]) m.appendChild(el('span', 'badge ' + i.status, STATUS[i.status]));
    b.appendChild(m); b.appendChild(el('h3', '', i.title));
    b.appendChild(el('p', '', i.about || (i.bullets || [])[0] || ''));
    c.appendChild(b);
    c.onclick = function () { open(i); };
    return c;
  }
  function render() {
    $('tab-news').setAttribute('aria-pressed', String(state.tab === 'news'));
    $('tab-catalog').setAttribute('aria-pressed', String(state.tab === 'catalog'));
    chips();
    var out = $('out'); out.textContent = '';
    var items = list().filter(matches);
    if (state.tab === 'catalog' && !state.q) {
      D.tables.filter(function (t) { return state.group === 'all' || t.group === state.group; }).forEach(function (t) {
        var w = el('div', 'tbl'); w.appendChild(el('h4', '', t.title));
        var tb = el('table'), hr = el('tr'); t.columns.forEach(function (c) { hr.appendChild(el('th', '', c)); });
        var th = el('thead'); th.appendChild(hr); tb.appendChild(th);
        var body = el('tbody'); t.rows.forEach(function (r) { var tr = el('tr'); r.forEach(function (c) { tr.appendChild(el('td', '', c)); }); body.appendChild(tr); });
        tb.appendChild(body); w.appendChild(tb); out.appendChild(w);
      });
    }
    if (!items.length) { out.appendChild(el('div', 'empty', state.tab === 'news' ? 'Новостей по этому фильтру пока нет. Лента обновляется каждый день в 12:00.' : 'Ничего не найдено.')); return; }
    items = items.slice().sort(function (a, b) {
      if (state.sort === 'name') return a.title.localeCompare(b.title, 'ru');
      var k = (a.sort + a.report).localeCompare(b.sort + b.report);
      return state.sort === 'old' ? k : -k;
    });
    if (state.tab === 'news' && state.sort !== 'name') {
      // one news feed, headed by the development's date
      var g = null, last = null;
      items.forEach(function (i) {
        if (i.sort !== last) { last = i.sort; out.appendChild(el('div', 'week', dayLabel(i.sort))); g = el('div', 'feed'); out.appendChild(g); }
        g.appendChild(card(i));
      });
    } else {
      var g2 = el('div', state.tab === 'news' ? 'feed' : 'grid'); items.forEach(function (i) { g2.appendChild(card(i)); }); out.appendChild(g2);
    }
  }
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  function dayLabel(s) {
    var p = (s || '').split('-');
    if (p.length !== 3) return s || '';
    if (p[1] === '01' && p[2] === '01') return p[0] + ' год';
    var d = new Date(+p[0], +p[1] - 1, +p[2]), t = new Date(); t.setHours(0, 0, 0, 0);
    var diff = Math.round((t - d) / 86400000);
    var txt = (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0];
    return diff === 0 ? 'Сегодня · ' + txt : diff === 1 ? 'Вчера · ' + txt : txt;
  }
  function open(i) {
    var s = $('sheet'); s.textContent = '';
    var x = el('button', 'close', 'Закрыть'); x.onclick = function () { $('dlg').close(); }; s.appendChild(x);
    var m = el('div', 'meta'); m.appendChild(el('span', 'tag', i.category || names[i.group] || ''));
    if (i.date) m.appendChild(el('span', '', i.date));
    if (STATUS[i.status]) m.appendChild(el('span', 'badge ' + i.status, STATUS[i.status]));
    s.appendChild(m); s.appendChild(el('h2', '', i.title));
    if (i.media) { s.appendChild(media(i, 'hero')); if (i.caption) s.appendChild(el('div', 'cap', i.caption)); }
    if (i.about) { var a = el('div', 'about'); a.appendChild(el('b', '', 'Простыми словами: ')); a.appendChild(document.createTextNode(i.about)); s.appendChild(a); }
    if ((i.bullets || []).length) { var ul = el('ul'); i.bullets.forEach(function (b) { ul.appendChild(el('li', '', b)); }); s.appendChild(ul); }
    if ((i.specs || []).length) { s.appendChild(el('h5', '', 'Характеристики')); var sp = el('div', 'specs'); i.specs.forEach(function (kv) { var d = el('div'); d.appendChild(el('span', '', kv[0])); d.appendChild(document.createTextNode(kv[1])); sp.appendChild(d); }); s.appendChild(sp); }
    if (i.takeaway && !D.public) s.appendChild(el('div', 'take', i.takeaway));
    if ((i.sources || []).length) { s.appendChild(el('h5', '', 'Источники')); var src = el('div', 'row'); i.sources.forEach(function (x) { src.appendChild(link(x)); }); s.appendChild(src); }
    if ((i.evidence || []).length) {
      var det = el('details'); det.appendChild(el('summary', '', 'Цитаты-доказательства (' + i.evidence.length + ')'));
      var ev = el('div', 'ev');
      i.evidence.forEach(function (e) { var d = el('div'); d.appendChild(el('b', '', e.claim)); d.appendChild(el('q', '', e.quote)); if (safeUrl(e.url)) d.appendChild(link({label: e.url, url: e.url})); ev.appendChild(d); });
      det.appendChild(ev); s.appendChild(det);
    }
    $('dlg').showModal(); s.scrollTop = 0;
  }
  $('dlg').addEventListener('click', function (e) { if (e.target === this) this.close(); });
  $('tab-news').onclick = function () { state.tab = 'news'; state.group = 'all'; render(); };
  $('tab-catalog').onclick = function () { state.tab = 'catalog'; state.group = 'all'; render(); };
  $('q').oninput = function () { state.q = this.value.trim().toLowerCase(); render(); };
  $('only').onchange = function () { state.only = this.checked; render(); };
  $('sort').onchange = function () { state.sort = this.value; render(); };
  render();
  }  // app()
})();
</script>
</body>
</html>
