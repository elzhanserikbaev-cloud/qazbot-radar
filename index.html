<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>QazBot Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: quiet news-site layout — masthead, text nav, hero + "свежее" rail, one card per section, list + model of the day, footer.
   White ground, one blue accent, hairlines instead of boxes. */
:root {
  --bg: #FFFFFF; --soft: #F5F6F8; --ink: #141A26; --muted: #687385; --line: #E7E9EE;
  --accent: #2450D6; --accent-soft: #EEF2FD; --ok: #1F8A5B;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F131A; --soft: #161C26; --ink: #E8ECF2; --muted: #95A0B2; --line: #252D3A;
  --accent: #7D9BFF; --accent-soft: #1C2540; --ok: #4CC38A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F131A; --soft: #161C26; --ink: #E8ECF2; --muted: #95A0B2; --line: #252D3A;
  --accent: #7D9BFF; --accent-soft: #1C2540; --ok: #4CC38A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* masthead */
.mast .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px; }
.logo { font: 700 26px/1 var(--display); letter-spacing: -0.02em; margin: 0; }
.logo span { color: var(--accent); }
.today { color: var(--muted); font-size: 13px; margin-left: auto; }
.search { position: relative; flex: 0 1 280px; min-width: 0; }
.search input { width: 100%; font: 14px var(--body); padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
/* nav */
nav.cats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
nav.cats .wrap { display: flex; align-items: center; gap: 4px 18px; }
.links { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.links::-webkit-scrollbar { display: none; }
.links button { background: none; border: 0; padding: 13px 0 11px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap; cursor: pointer; }
.links button:hover { color: var(--ink); }
.links button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.links .sep { width: 1px; background: var(--line); margin: 10px 0; flex: none; }
.tools { display: flex; align-items: center; gap: 14px; flex: none; }
.tools select { font: 13px var(--body); border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 0; }
.tools label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; }
/* latest strip */
.strip { background: var(--soft); }
.strip .wrap { display: flex; gap: 12px; align-items: baseline; padding-block: 10px; font-size: 14px; min-width: 0; }
.strip b { color: var(--accent); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; flex: none; }
.strip button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.strip button:hover { text-decoration: underline; }

main .wrap { padding-block: 28px 56px; display: flex; flex-direction: column; gap: 44px; }
h2.sec { font: 600 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.kicker { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.when { color: var(--muted); font-size: 13px; }
.media { background: var(--soft); overflow: hidden; border-radius: 6px; aspect-ratio: 16 / 10; display: grid; place-items: center; max-width: 100%; }
.media img, .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.media .ph { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.hit { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: block; width: 100%; }
.hit:hover .t { color: var(--accent); }

/* hero + rail */
.top { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.hero .media { aspect-ratio: 4 / 3; }
.hero .t { font: 700 clamp(24px, 2.6vw, 32px)/1.15 var(--display); margin: 8px 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.hero p { margin: 0 0 16px; color: var(--muted); }
.more { color: var(--accent); font-weight: 600; font-size: 14px; }
.rail { border-left: 1px solid var(--line); padding-left: 28px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rail li { padding: 12px 0; border-top: 1px solid var(--line); }
.rail li:first-child { border-top: 0; padding-top: 0; }
.rail .hit { display: grid; grid-template-columns: 22px minmax(0, 1fr) 64px; gap: 12px; align-items: start; }
.rail .n { font: 700 15px var(--display); color: var(--accent); }
.rail .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.rail .media { aspect-ratio: 1; border-radius: 4px; }

/* sections */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.cards .t { font-weight: 600; font-size: 15px; line-height: 1.35; margin: 4px 0 6px; }
.cards .kicker { display: block; margin-top: 12px; }

/* list + pick */
.bottom { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 44px; align-items: start; }
.rows { display: flex; flex-direction: column; }
.row { padding: 16px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row .hit { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: start; }
.row .t { font-weight: 600; font-size: 16px; line-height: 1.35; margin: 2px 0 6px; }
.row p { margin: 0 0 6px; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ok { color: var(--ok); font-size: 13px; }
.hot { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-right: 8px; }
.pick { background: var(--soft); border-radius: 8px; padding: 20px; }
.pick .t { font: 700 20px/1.2 var(--display); margin: 12px 0 8px; }
.pick p { margin: 0; color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); padding: 32px 0; }
.decks { display: grid; gap: 12px; }
.deck { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--soft); flex-wrap: wrap; }
.deck .t { font-family: var(--display); font-weight: 600; }
.deck .when { color: var(--muted); font-size: 13px; }
.deck button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px;
  cursor: pointer; font: inherit; font-weight: 600; }
.deck button:disabled { opacity: .6; cursor: progress; }

/* catalog tables */
.tbl { overflow-x: auto; border-top: 1px solid var(--line); }
.tbl h3 { font: 600 16px var(--display); margin: 16px 0 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }

footer { border-top: 1px solid var(--line); background: var(--soft); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; justify-content: space-between; padding-block: 24px; color: var(--muted); font-size: 13px; }
footer .logo { font-size: 18px; color: var(--ink); }
.logout { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 13px; }

/* detail sheet */
dialog { border: 0; padding: 0; width: min(720px, 100%); max-height: 100%; height: 100%; margin: 0 0 0 auto; background: var(--bg); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 22, .45); }
.sheet { padding: 22px max(24px, env(safe-area-inset-right, 0px)) 40px 24px; display: flex; flex-direction: column; gap: 16px; }
.close { align-self: flex-end; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.sheet h2 { font: 700 28px/1.15 var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sheet .media { aspect-ratio: auto; }
.sheet .media img, .sheet .media video { height: auto; }
.cap { font-size: 12.5px; color: var(--muted); margin-top: -8px; }
.about { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; }
.sheet ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 20px; }
.specs div { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; font-weight: 500; }
.specs span { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.take { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; font-weight: 500; }
.sheet h5 { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px 16px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 500; color: var(--muted); }
.ev { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.ev q { display: block; color: var(--muted); font-style: italic; }

/* password lock */
body.locked .mast, body.locked nav, body.locked .strip, body.locked main, body.locked footer { display: none; }
.lock { min-height: 100vh; display: grid; place-items: center; background: var(--soft); padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lockcard { width: min(380px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.lockcard p { margin: 0; color: var(--muted); }
.lockcard input[type=password] { font: 16px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.lockcard label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
.lockcard button { font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
.lockcard button:disabled { opacity: .7; cursor: progress; }
.err { color: #C0392B; font-size: 14px; min-height: 1em; }

@media (max-width: 980px) {
  .top { grid-template-columns: minmax(0, 1fr); }
  .rail { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 20px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bottom { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .today { display: none; }
  .search { flex: 1 1 100%; }
  nav.cats .wrap { flex-wrap: wrap; }
  .tools { padding-bottom: 8px; }
  .row .hit { grid-template-columns: 104px minmax(0, 1fr); gap: 14px; }
  .row p { display: none; }
  .cards { gap: 18px; }
}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <p class="logo">QazBot <span>Radar</span></p>
  <span class="today" id="today"></span>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="q" type="search" placeholder="Поиск по разработкам" aria-label="Поиск">
  </div>
</div></header>
<nav class="cats" aria-label="Разделы"><div class="wrap">
  <div class="links" id="links"></div>
  <div class="tools">
    <select id="sort" aria-label="Сортировка">
      <option value="new">Сначала новые</option>
      <option value="old">Сначала старые</option>
      <option value="name">По роботу А–Я</option>
    </select>
    <label><input id="only" type="checkbox"> только ✓ первоисточник</label>
  </div>
</div></nav>
<div class="strip" id="strip" hidden><div class="wrap"><b>Новое</b><button id="latest" type="button"></button></div></div>
<main><div class="wrap" id="out"></div></main>
<footer><div class="wrap">
  <p class="logo">QazBot <span>Radar</span></p>
  <span id="foot"></span>
  <span id="footbtn"></span>
</div></footer>

<script>
(function () {
  var RAW = JSON.parse(document.getElementById('data').textContent || 'null') || {news: [], catalog: [], tables: [], groups: [], updated: ''};
  // ---- password lock (public copy): data and media are AES-GCM encrypted, key = PBKDF2(password) ----
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function ub64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function decrypt(key, bytes) { return crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes.slice(0, 12)}, key, bytes.slice(12)); }
  function openWith(key) { return decrypt(key, b64(RAW.enc)).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); }); }
  var REMEMBER = 'qr-key-' + (RAW.salt || '');
  function lockScreen() {
    document.body.classList.add('locked');
    var box = document.createElement('form'); box.className = 'lock';
    box.innerHTML = '<div class="lockcard"><p class="logo">QazBot <span>Radar</span></p><p>Закрытый сайт. Введите пароль.</p>' +
      '<input id="pw" type="password" autocomplete="current-password" aria-label="Пароль" placeholder="Пароль" required>' +
      '<label><input id="rem" type="checkbox" checked> запомнить на этом устройстве</label>' +
      '<button type="submit" id="go">Войти</button><div id="err" class="err" role="alert"></div></div>';
    document.body.appendChild(box);
    var pw = document.getElementById('pw'); pw.focus();
    box.addEventListener('submit', function (e) {
      e.preventDefault();
      var go = document.getElementById('go'), err = document.getElementById('err');
      go.disabled = true; go.textContent = 'Проверяю…'; err.textContent = '';
      crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) { return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(RAW.salt), iterations: RAW.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']); })
        .then(function (key) { return openWith(key).then(function (D) {
          if (document.getElementById('rem').checked) crypto.subtle.exportKey('raw', key).then(function (r) { try { localStorage.setItem(REMEMBER, ub64(new Uint8Array(r))); } catch (x) {} });
          box.remove(); document.body.classList.remove('locked'); app(D, key);
        }); })
        .catch(function () { go.disabled = false; go.textContent = 'Войти'; err.textContent = 'Неверный пароль. Попробуйте ещё раз.'; pw.select(); });
    });
  }
  if (RAW.enc) {
    var saved = null; try { saved = localStorage.getItem(REMEMBER); } catch (x) {}
    if (saved) {
      crypto.subtle.importKey('raw', b64(saved), {name: 'AES-GCM'}, false, ['decrypt'])
        .then(function (key) { return openWith(key).then(function (D) { app(D, key); }); })
        .catch(function () { try { localStorage.removeItem(REMEMBER); } catch (x) {} lockScreen(); });
    } else lockScreen();
  } else app(RAW, null);

  function app(D, KEY) {
  var names = {}; D.groups.forEach(function (g) { names[g[0]] = g[1]; });
  var state = {tab: 'news', group: 'all', q: '', only: false, sort: 'new'};
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }
  function link(s) { var u = safeUrl(s.url); if (!u) return el('span', '', s.label || ''); var a = el('a', '', s.label || u); a.href = u; a.target = '_blank'; a.rel = 'noopener'; return a; }
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var blobs = {};
  function blobUrl(path, mime) {  // encrypted media -> decrypted blob: URL (cached)
    if (!blobs[path]) blobs[path] = fetch(path).then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) { return decrypt(KEY, new Uint8Array(buf)); })
      .then(function (plain) { return URL.createObjectURL(new Blob([plain], {type: mime})); });
    return blobs[path];
  }
  function mediaEl(i) {
    var isVideo = /\.mp4$/i.test(i.media) || /^video\//.test(i.mime || '');
    var e = el(isVideo ? 'video' : 'img');
    if (isVideo) { e.muted = true; e.autoplay = true; e.loop = true; e.playsInline = true; e.setAttribute('muted', ''); e.setAttribute('playsinline', ''); e.setAttribute('aria-label', i.title); }
    else { e.alt = i.title; e.loading = 'lazy'; }
    if (KEY && i.mime) blobUrl(i.media, i.mime).then(function (u) { e.src = u; }).catch(function () {});
    else e.src = i.media;
    return e;
  }
  function media(i) {  // framed media or a quiet placeholder
    var box = el('div', 'media');
    if (i.media) box.appendChild(mediaEl(i)); else box.appendChild(el('span', 'ph', names[i.group] || ''));
    return box;
  }
  function when(s) {
    var p = (s || '').split('-');
    if (p.length !== 3) return s || '';
    if (p[1] === '01' && p[2] === '01') return p[0];
    var d = new Date(+p[0], +p[1] - 1, +p[2]), t = new Date(); t.setHours(0, 0, 0, 0);
    var diff = Math.round((t - d) / 86400000);
    if (diff === 0) return 'сегодня';
    if (diff === 1) return 'вчера';
    if (diff > 1 && diff < 7) return diff + (diff < 5 ? ' дня' : ' дней') + ' назад';
    return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + (p[0] === String(t.getFullYear()) ? '' : ' ' + p[0]);
  }
  function hot(i) {  // urgent news: marked for ~2 days after it was found
    if (i.kind !== 'urgent') return null;
    var p = (i.report || '').split('-'); if (p.length !== 3) return null;
    return (Date.now() - new Date(+p[0], +p[1] - 1, +p[2])) < 3 * 86400000 ? el('span', 'hot', 'Срочно') : null;
  }
  function kicker(i) { var k = el('span', 'kicker'), h = hot(i); if (h) k.appendChild(h); k.appendChild(document.createTextNode(i.category || names[i.group] || '')); return k; }
  function hit(i, parts) { var b = el('button', 'hit'); b.type = 'button'; parts.forEach(function (p) { if (p) b.appendChild(p); }); b.onclick = function () { open(i); }; return b; }

  var now = new Date();
  $('today').textContent = now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  $('foot').textContent = 'Инженерные разработки в робототехнике · обновляется каждый день в 12:00, срочное — в течение часа · данные от ' + D.updated;
  if (KEY) {
    var lo = el('button', 'logout', 'Выйти'); lo.type = 'button';
    lo.onclick = function () { try { localStorage.removeItem(REMEMBER); } catch (x) {} location.reload(); };
    $('footbtn').appendChild(lo);
  }

  function sorted(arr) {
    return arr.slice().sort(function (a, b) {
      if (state.sort === 'name') return a.title.localeCompare(b.title, 'ru');
      var k = (a.sort + a.report).localeCompare(b.sort + b.report);
      return state.sort === 'old' ? k : -k;
    });
  }
  function matches(i) {
    if (state.group !== 'all' && i.group !== state.group) return false;
    if (state.only && i.status !== 'official') return false;
    if (!state.q) return true;
    var hay = [i.title, i.category, i.about, i.takeaway].concat(i.bullets || []).join(' ').toLowerCase();
    return state.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function nav() {
    var box = $('links'); box.textContent = '';
    function btn(label, on, fn) { var b = el('button', '', label); b.type = 'button'; b.setAttribute('aria-current', String(on)); b.onclick = fn; box.appendChild(b); }
    var counts = {}; D.news.forEach(function (i) { counts[i.group] = 1; });
    btn('Главная', state.tab === 'news' && state.group === 'all', function () { state.tab = 'news'; state.group = 'all'; render(); });
    D.groups.forEach(function (g) {
      if (!counts[g[0]]) return;
      btn(g[1], state.tab === 'news' && state.group === g[0], function () { state.tab = 'news'; state.group = g[0]; render(); });
    });
    box.appendChild(el('span', 'sep'));
    btn('Каталог моделей', state.tab === 'catalog', function () { state.tab = 'catalog'; state.group = 'all'; render(); });
    if ((D.decks || []).length) btn('Презентации', state.tab === 'decks', function () { state.tab = 'decks'; state.group = 'all'; render(); });
  }
  function download(d, b) {  // encrypted .pptx -> decrypt in the browser -> save
    if (!KEY) { var a0 = el('a'); a0.href = d.file; a0.download = d.name; document.body.appendChild(a0); a0.click(); a0.remove(); return; }
    b.disabled = true; b.textContent = 'Скачиваю…';
    blobUrl(d.file, d.mime).then(function (u) {
      var a = el('a'); a.href = u; a.download = d.name; document.body.appendChild(a); a.click(); a.remove();
      b.disabled = false; b.textContent = 'Скачать .pptx';
    }).catch(function () { b.disabled = false; b.textContent = 'Ошибка — ещё раз'; });
  }
  function decksPage(out) {
    var sec = el('section'); sec.appendChild(el('h2', 'sec', 'Презентации · ' + D.decks.length));
    var list = el('div', 'decks');
    D.decks.forEach(function (d) {
      var r = el('div', 'deck'), txt = el('div');
      txt.appendChild(el('div', 't', d.title)); txt.appendChild(el('span', 'when', d.name + ' · ' + d.size_mb + ' МБ'));
      var b = el('button', '', 'Скачать .pptx'); b.type = 'button'; b.onclick = function () { download(d, b); };
      r.appendChild(txt); r.appendChild(b); list.appendChild(r);
    });
    sec.appendChild(list); out.appendChild(sec);
  }
  function row(i) {
    var r = el('div', 'row'), txt = el('div');
    txt.appendChild(kicker(i)); txt.appendChild(el('div', 't', i.title));
    txt.appendChild(el('p', '', i.about || (i.bullets || [])[0] || ''));
    var w = el('span', 'when', when(i.sort)); txt.appendChild(w);
    if (i.status === 'official') { txt.appendChild(document.createTextNode('  ')); txt.appendChild(el('span', 'ok', '✓ первоисточник')); }
    r.appendChild(hit(i, [media(i), txt]));
    return r;
  }
  function home(out, items) {
    var hero = items[0], rail = items.slice(1, 6);
    var top = el('section', 'top');
    var h = el('div', 'hero'), ht = el('div');
    ht.appendChild(kicker(hero)); ht.appendChild(el('h1', 't', hero.title));
    ht.appendChild(el('p', '', hero.about || (hero.bullets || [])[0] || ''));
    ht.appendChild(el('span', 'more', 'Подробнее →'));
    h.appendChild(hit(hero, [media(hero)])); h.appendChild(hit(hero, [ht]));
    top.appendChild(h);
    if (rail.length) {
      var side = el('aside', 'rail'); side.appendChild(el('h2', 'sec', 'Свежее'));
      var ol = el('ol');
      rail.forEach(function (i, n) {
        var li = el('li'), mid = el('div'); mid.appendChild(el('div', 't', i.title)); mid.appendChild(el('span', 'when', when(i.sort)));
        li.appendChild(hit(i, [el('span', 'n', String(n + 1)), mid, media(i)])); ol.appendChild(li);
      });
      side.appendChild(ol); top.appendChild(side);
    }
    out.appendChild(top);
    // one latest item per section
    var seen = {}, per = [];
    items.forEach(function (i) { if (!seen[i.group] && per.length < 4) { seen[i.group] = 1; per.push(i); } });
    if (per.length > 1) {
      var sec = el('section'); sec.appendChild(el('h2', 'sec', 'По разделам'));
      var cards = el('div', 'cards');
      if (window.innerWidth > 980) cards.style.gridTemplateColumns = 'repeat(' + per.length + ', minmax(0, 1fr))';
      per.forEach(function (i) {
        var k = el('span', 'kicker', names[i.group] || i.category), t = el('div', 't', i.title), w = el('span', 'when', when(i.sort));
        cards.appendChild(hit(i, [media(i), k, t, w]));
      });
      sec.appendChild(cards); out.appendChild(sec);
    }
    // all news + model of the day
    var bottom = el('section', 'bottom'), left = el('div');
    left.appendChild(el('h2', 'sec', 'Все новости'));
    var rows = el('div', 'rows'); items.forEach(function (i) { rows.appendChild(row(i)); }); left.appendChild(rows);
    bottom.appendChild(left);
    var withMedia = D.catalog.filter(function (i) { return i.media; });
    if (withMedia.length) {
      var day = Math.floor(Date.now() / 86400000), pick = withMedia[day % withMedia.length];
      var right = el('aside'); right.appendChild(el('h2', 'sec', 'Модель дня из каталога'));
      var pk = el('div', 'pick'), pt = el('div');
      pt.appendChild(el('div', 't', pick.title)); pt.appendChild(el('p', '', pick.about || ''));
      pk.appendChild(hit(pick, [media(pick), kicker(pick), pt])); right.appendChild(pk);
      bottom.appendChild(right);
    }
    out.appendChild(bottom);
  }
  function render() {
    nav();
    var out = $('out'); out.textContent = '';
    var latest = D.news.slice();
    latest.sort(function (a, b) { return (b.sort + b.report).localeCompare(a.sort + a.report); });
    if (latest.length) { $('strip').hidden = false; $('latest').textContent = latest[0].title + ' · ' + when(latest[0].sort); $('latest').onclick = function () { open(latest[0]); }; }
    if (state.tab === 'decks') { decksPage(out); return; }
    var src = state.tab === 'news' ? D.news : D.catalog;
    var items = sorted(src.filter(matches));
    var isHome = state.tab === 'news' && state.group === 'all' && !state.q && !state.only && state.sort === 'new';
    if (isHome && items.length) { home(out, items); return; }
    var sec = el('section');
    var title = state.tab === 'catalog' ? 'Каталог моделей' : (state.group === 'all' ? 'Все новости' : names[state.group]);
    if (state.q) title = 'Поиск: «' + state.q + '»';
    sec.appendChild(el('h2', 'sec', title + ' · ' + items.length));
    if (state.tab === 'catalog' && !state.q) {
      D.tables.forEach(function (t) {
        var w = el('div', 'tbl'); w.appendChild(el('h3', '', t.title));
        var tb = el('table'), hr = el('tr'); t.columns.forEach(function (c) { hr.appendChild(el('th', '', c)); });
        var th = el('thead'); th.appendChild(hr); tb.appendChild(th);
        var body = el('tbody'); t.rows.forEach(function (r) { var tr = el('tr'); r.forEach(function (c) { tr.appendChild(el('td', '', c)); }); body.appendChild(tr); });
        tb.appendChild(body); w.appendChild(tb); sec.appendChild(w);
      });
      sec.appendChild(el('h2', 'sec', 'Подробно по моделям'));
    }
    if (!items.length) { sec.appendChild(el('div', 'empty', state.tab === 'news' ? 'Новостей по этому фильтру пока нет. Лента обновляется каждый день в 12:00.' : 'Ничего не найдено.')); out.appendChild(sec); return; }
    var rows = el('div', 'rows'); items.forEach(function (i) { rows.appendChild(row(i)); }); sec.appendChild(rows);
    out.appendChild(sec);
  }
  function open(i) {
    var s = $('sheet'); s.textContent = '';
    var x = el('button', 'close', 'Закрыть'); x.type = 'button'; x.onclick = function () { $('dlg').close(); }; s.appendChild(x);
    var meta = el('div'); meta.appendChild(kicker(i));
    meta.appendChild(document.createTextNode('  ')); meta.appendChild(el('span', 'when', i.date || when(i.sort)));
    if (i.status === 'official') { meta.appendChild(document.createTextNode('  ')); meta.appendChild(el('span', 'ok', '✓ первоисточник')); }
    else if (i.status === 'media') { meta.appendChild(document.createTextNode('  ')); meta.appendChild(el('span', 'when', 'по данным профильных СМИ')); }
    s.appendChild(meta); s.appendChild(el('h2', '', i.title));
    if (i.media) { s.appendChild(media(i)); if (i.caption) s.appendChild(el('div', 'cap', i.caption)); }
    if (i.about) s.appendChild(el('div', 'about', i.about));
    if ((i.bullets || []).length) { var ul = el('ul'); i.bullets.forEach(function (b) { ul.appendChild(el('li', '', b)); }); s.appendChild(ul); }
    if ((i.specs || []).length) { s.appendChild(el('h5', '', 'Характеристики')); var sp = el('div', 'specs'); i.specs.forEach(function (kv) { var d = el('div'); d.appendChild(el('span', '', kv[0])); d.appendChild(document.createTextNode(kv[1])); sp.appendChild(d); }); s.appendChild(sp); }
    if (i.takeaway && !D.public) s.appendChild(el('div', 'take', i.takeaway));
    if ((i.sources || []).length) { s.appendChild(el('h5', '', 'Источники')); var src = el('div', 'srcs'); i.sources.forEach(function (x) { src.appendChild(link(x)); }); s.appendChild(src); }
    if ((i.evidence || []).length) {
      var det = el('details'); det.appendChild(el('summary', '', 'Цитаты-доказательства (' + i.evidence.length + ')'));
      var ev = el('div', 'ev');
      i.evidence.forEach(function (e) { var d = el('div'); d.appendChild(el('b', '', e.claim)); d.appendChild(el('q', '', e.quote)); if (safeUrl(e.url)) d.appendChild(link({label: e.url, url: e.url})); ev.appendChild(d); });
      det.appendChild(ev); s.appendChild(det);
    }
    $('dlg').showModal(); s.scrollTop = 0;
  }
  $('dlg').addEventListener('click', function (e) { if (e.target === this) this.close(); });
  $('q').oninput = function () { state.q = this.value.trim().toLowerCase(); render(); };
  $('only').onchange = function () { state.only = this.checked; render(); };
  $('sort').onchange = function () { state.sort = this.value; render(); };
  render();
  }  // app()
})();
</script>
</body>
</html>
